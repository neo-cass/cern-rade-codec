plugins {
    id 'java-library'
    id ('cern.devops.cbng.dependency') version "4.0.52"
    id('cern.devops.cbng.publication') version '4.0.17'
}

configurations.all {
    resolutionStrategy {
        cacheChangingModulesFor 0, 'seconds'
    }
}

repositories {
    mavenCentral()
    // our package index to resolve dependencies
    maven {
        url 'https://artifactory.cern.ch/release'
    }
}

dependencies {
    implementation ("cern.japc:japc:PRO") {changing = true}
    implementation ("cern.japc:japc-ext-cmwrda3:PRO"){changing = true}
    implementation ("cern.japc:japc-value:PRO"){changing = true}
    implementation ("cern.japc:japc-ext-remote:PRO"){changing = true}
    implementation ("cern.cmw:cmw-data:PRO"){changing = true}
    implementation("org.apache.commons:commons-lang3:3.12.0")
    implementation("jakarta.servlet:jakarta.servlet-api:5.0.0")
    implementation ("com.google.code.gson:gson:2.10.1")
    implementation("cern.rade.services:common:common-renovation-new"){changing = true}
}

jar {
    archiveFileName = project.property('jarName')
    from file("$buildDir/libs/$jar")
    getDestinationDirectory().set(file("."))
}


// requirement for building this project
java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(17)
    }
    withJavadocJar()
    withSourcesJar()
}

