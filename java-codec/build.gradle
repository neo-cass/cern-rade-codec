plugins {
    id 'java'  // or java-library ?
    id 'war'
    id ('cern.devops.cbng.dependency') version "4.0.52"
}
repositories {
    // our package index to resolve dependencies
    maven {
        url 'https://artifactory.cern.ch/release'
    }
}

dependencies {
    implementation ("cern.accsoft.commons:accsoft-commons-util:PRO")
    implementation ("cern.japc:japc:PRO")
    implementation ("cern.japc:japc-ext-cmwrda3:PRO")
    implementation ("cern.japc:japc-ext-remote:PRO")
    implementation ("cern.cmw:cmw-data:PRO")
    implementation('jakarta.servlet:jakarta.servlet-api:5.0.0')
}

//TODO: exclude non-essential class files from wars
task createHelloWorldWar(type: War, dependsOn: classes) {
    baseName = 'TomcatHelloWorld'
    from file('src/main/wars/examples/TomcatHelloWorld')
    destinationDir = file("$buildDir/wars/examples")
}

task createJAPCWar(type: War, dependsOn: classes) {
    baseName = 'TomcatJAPC'
    from file('src/main/wars/examples/TomcatJAPC')
    destinationDir = file("$buildDir/wars/examples")
}


// requirement for building this project
java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(17)
    }

    withJavadocJar()
    withSourcesJar()
}

